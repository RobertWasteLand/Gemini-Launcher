<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemini</title>
<link rel="stylesheet" href="GL_Style.css">
<script src="GL_Main.js" defer></script>
</head>
<body>
<svg class="GL_Filters" width="0" height="0" aria-hidden="true">
  <filter id="GL_Crisp" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncA type="discrete" tableValues="0 1"></feFuncA>
    </feComponentTransfer>
  </filter>
</svg>
<div class="GL_Frame" data-tauri-drag-region>
  <div class="GL_Window_Controls">
    <button id="GL_Window_Minimize" type="button" aria-label="Minimize"></button>
    <button id="GL_Window_Close" type="button" aria-label="Close"></button>
  </div>

  <aside class="GL_Options">
    <h2>Options</h2>
    <div id="GL_Options_List" class="GL_Options_List"></div>
    <p class="GL_Game_Line"><span id="GL_Game_Path">Looking for Project Zomboid...</span> <button id="GL_Game_Locate" type="button" class="GL_Link">Locate game</button></p>
  </aside>

  <header class="GL_Brand" data-tauri-drag-region>
    <p data-tauri-drag-region><span id="GL_Version_Text"></span> <span id="GL_Update_Text" class="GL_Update"></span></p>
  </header>

  <section class="GL_Notes">
    <div class="GL_Tabs" role="tablist">
      <button type="button" role="tab" class="GL_Tab" data-page="GL_Notes_Text">Patch Notes</button>
      <button type="button" role="tab" class="GL_Tab" data-page="GL_Environment">Environment</button>
      <button type="button" role="tab" class="GL_Tab" data-page="GL_Patches">Patches</button>
    </div>
    <pre id="GL_Notes_Text" class="GL_Page">Loading patch notes...</pre>
    <div id="GL_Environment" class="GL_Page GL_Environment" hidden>
      <p id="GL_Environment_Off" class="GL_Empty" hidden>Turn on Environment in Addons to use these.</p>
      <div id="GL_Environment_List" class="GL_Environment_List"></div>
    </div>
    <div id="GL_Patches" class="GL_Page GL_Patches" hidden>
      <p id="GL_Patches_Off" class="GL_Empty" hidden>Turn on Patches in Addons to use these.</p>
      <div id="GL_Patches_List" class="GL_Patches_List"></div>
    </div>
    <div id="GL_Presets" class="GL_Presets" hidden>
      <button id="GL_Preset_Vanilla" type="button" class="GL_Preset"><span>Vanilla</span></button>
      <button id="GL_Preset_Gemini" type="button" class="GL_Preset"><span>Gemini</span></button>
    </div>
  </section>

  <button id="GL_Play_Button" type="button" disabled><span id="GL_Play_Text">PLAY</span></button>
  <p id="GL_Message_Text" class="GL_Message"></p>
  <nav id="GL_Links" class="GL_Links" aria-label="Links"></nav>

  <div id="GL_Update_Offer" class="GL_Overlay" hidden>
    <div class="GL_Dialog" role="dialog" aria-modal="true" aria-labelledby="GL_Update_Title">
      <h2 id="GL_Update_Title">Launcher Update</h2>
      <p>A launcher update is ready.</p>
      <p id="GL_Update_From" class="GL_Dialog_From"></p>
      <button id="GL_Update_Now_Button" type="button" class="GL_Dialog_Button"><span>Update now</span></button>
      <button id="GL_Update_Later_Button" type="button" class="GL_Dialog_Button"><span>Later</span></button>
    </div>
  </div>
</div>
</body>
</html>

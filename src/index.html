<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemini Launcher</title>
<link rel="stylesheet" href="GL_Style.css">
<script src="GL_Main.js" defer></script>
</head>
<body>
<div class="GL_Frame" data-tauri-drag-region>
  <div class="GL_Window_Controls">
    <button id="GL_Window_Minimize" type="button" aria-label="Minimize">&#x2013;</button>
    <button id="GL_Window_Close" type="button" aria-label="Close">&#x2715;</button>
  </div>

  <aside class="GL_Panel GL_Options">
    <h2>Options</h2>
    <div id="GL_Options_List" class="GL_Options_List"></div>
  </aside>

  <header class="GL_Brand" data-tauri-drag-region>
    <h1 data-tauri-drag-region>Season Name</h1>
    <p data-tauri-drag-region><span id="GL_Version_Text">Launcher</span> <span id="GL_Update_Text" class="GL_Update"></span></p>
  </header>

  <section class="GL_Panel GL_Notes">
    <div class="GL_Tabs" role="tablist">
      <button type="button" role="tab" class="GL_Tab" data-page="GL_Notes_Text">Patch Notes</button>
      <button type="button" role="tab" class="GL_Tab" data-page="GL_Environment">Environment</button>
      <div id="GL_Presets" class="GL_Presets" hidden>
        <button id="GL_Preset_Vanilla" type="button" class="GL_Preset">Vanilla</button>
        <button id="GL_Preset_Gemini" type="button" class="GL_Preset">Gemini</button>
      </div>
    </div>
    <pre id="GL_Notes_Text" class="GL_Page">Loading patch notes…</pre>
    <div id="GL_Environment" class="GL_Page GL_Environment" hidden>
      <p id="GL_Environment_Off" class="GL_Empty" hidden>Turn on Environment in Addons to use these.</p>
      <div id="GL_Environment_List" class="GL_Environment_List"></div>
    </div>
  </section>

  <section class="GL_Play">
    <button id="GL_Play_Button" type="button" disabled>PLAY</button>
    <p id="GL_Message_Text" class="GL_Message"></p>
    <p class="GL_Game_Line"><span id="GL_Game_Path">Looking for Project Zomboid…</span> <button id="GL_Game_Locate" type="button" class="GL_Link">Locate game</button></p>
  </section>
</div>
</body>
</html>

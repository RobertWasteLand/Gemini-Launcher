name: GL_Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: GL_Release
  cancel-in-progress: false

jobs:
  GL_Release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: GL_Release_Check
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Raise \"version\" in src-tauri/tauri.conf.json, push, then run GL_Release again."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Releasing v$version"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Gemini Launcher v__VERSION__
          releaseBody: "New here? Download the setup .exe below and run it. Already installed? The launcher updates itself the next time you open it."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
